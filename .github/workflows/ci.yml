
name: CHAOSCLOUD CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/requirements.txt pytest

      - name: Run application tests
        working-directory: application
        run: pytest -q

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./application
          push: true
          tags: |
            ghcr.io/deepti-987/chaoscloud:latest
            ghcr.io/deepti-987/chaoscloud:${{ github.sha }}

  deploy:
    name: Deploy to Application EC2
    needs: test-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, chaoscloud-deploy]

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add application EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H 10.0.1.208 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application to K3s
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes ubuntu@10.0.1.208 "
            sudo k3s kubectl set image deployment/chaoscloud \
              chaoscloud=ghcr.io/deepti-987/chaoscloud:$IMAGE_TAG \
              -n chaoscloud &&
            sudo k3s kubectl rollout status deployment/chaoscloud \
              -n chaoscloud --timeout=180s
          "
