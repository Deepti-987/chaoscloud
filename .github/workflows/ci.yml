
name: CHAOSCLOUD CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/requirements.txt pytest

      - name: Run application tests
        working-directory: application
        run: pytest -q

      - name: Build and publish Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./application
          push: true
          tags: |
            ghcr.io/deepti-987/chaoscloud:latest
            ghcr.io/deepti-987/chaoscloud:${{ github.sha }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH
        if: github.event_name == 'push'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 to known hosts
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to application EC2
        if: github.event_name == 'push'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "
            sudo k3s kubectl set image deployment/chaoscloud \
              chaoscloud=ghcr.io/deepti-987/chaoscloud:$IMAGE_TAG \
              -n chaoscloud &&
            sudo k3s kubectl rollout status deployment/chaoscloud \
              -n chaoscloud --timeout=180s
          "
