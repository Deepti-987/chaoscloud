---
- name: Deploy CHAOSCLOUD Flask application
  hosts: app
  become: true

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: /opt/chaoscloud/application
        state: directory
        mode: '0755'

    - name: Copy application source code
      ansible.builtin.copy:
        src: ../../application/
        dest: /opt/chaoscloud/application/
        mode: preserve

    - name: Build CHAOSCLOUD Docker image
      ansible.builtin.command:
        cmd: docker build -t chaoscloud:latest /opt/chaoscloud/application

    - name: Find existing application container
      ansible.builtin.command:
        cmd: docker ps -aq --filter name=^/chaoscloud-app$
      register: existing_container
      changed_when: false

    - name: Remove previous application container
      ansible.builtin.command:
        cmd: docker rm -f {{ existing_container.stdout }}
      when: existing_container.stdout | length > 0

    - name: Start CHAOSCLOUD application
      ansible.builtin.command:
        cmd: docker run -d --name chaoscloud-app --restart unless-stopped -p 8000:8000 chaoscloud:latest

    - name: Wait for application port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        delay: 2
        timeout: 30

    - name: Verify application health
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/health
        method: GET
        status_code: 200
